name: Web Frontend CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build Web Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular Application
        run: npm run build -- --configuration production

      - name: Stage Deployment Files
        run: |
          mkdir -p staging
          cp -r dist staging/
          cp Dockerfile staging/
          cp docker-compose.yml staging/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-artifacts
          path: staging/
          retention-days: 3

  deploy:
    name: Deploy to Production VPS
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-artifacts
          path: staging/

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST || '62.171.162.167' }}
          username: ${{ secrets.SERVER_USER || 'romel' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "staging/*"
          target: "/home/romel/rmbreeding/web"
          strip_components: 1
          overwrite: true

      - name: Restart Web container on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST || '62.171.162.167' }}
          username: ${{ secrets.SERVER_USER || 'romel' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/romel/rmbreeding/web
            docker compose up -d --build --force-recreate
            echo "Web frontend successfully deployed and running!"
